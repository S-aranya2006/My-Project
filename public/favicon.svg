<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- Gradient Colors -->
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"></stop>
      <stop offset="100%" stop-color="#3b82f6"></stop>
    </linearGradient>

    <linearGradient id="grad2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"></stop>
      <stop offset="100%" stop-color="#06b6d4"></stop>
    </linearGradient>

    <!-- Glow -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"></feGaussianBlur>
      <feMerge>
        <feMergeNode in="coloredBlur"></feMergeNode>
        <feMergeNode in="SourceGraphic"></feMergeNode>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="110" fill="#020617"></rect>

  <!-- Abstract C -->
  <path d="M180 150
           C110 190 100 320 180 370
           C220 395 280 390 320 350" fill="none" stroke="url(#grad1)" stroke-width="38" stroke-linecap="round" filter="url(#glow)"></path>

  <!-- Abstract S -->
  <path d="M330 170
           C260 120 180 190 270 240
           C360 290 270 370 190 330" fill="none" stroke="url(#grad2)" stroke-width="34" stroke-linecap="round" filter="url(#glow)"></path>

  <!-- Small Tech Dot -->
  <circle cx="380" cy="140" r="16" fill="#06b6d4"></circle>
</svg>